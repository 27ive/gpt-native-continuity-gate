name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Passing release example
        run: continuity-gate validate examples/minimal-pass.json
      - name: Honest blocked example
        run: continuity-gate validate examples/honest-partial.json --report-only
      - name: Read-only MCP surface capture
        run: continuity-gate audit-tools examples/evidence/mcp-tools-list.json
      - name: Compile package
        run: python -m compileall -q src tests examples/read_only_mcp
